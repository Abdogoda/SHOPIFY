<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="100%" height="100%" class="flag-icon-svg" aria-label="Flag of the United States">
  <defs>
    <clipPath id="circle-us"><circle cx="256" cy="256" r="256"/></clipPath>
    <polygon id="us-star" points="0,-8.5 2.5,-2.6 8.8,-2.6 3.7,1.2 5.7,7.1 0,3.3 -5.7,7.1 -3.7,1.2 -8.8,-2.6 -2.5,-2.6" fill="#FFFFFF"/>
  </defs>
  <g clip-path="url(#circle-us)">
    <!-- 13 Alternating Stripes -->
    <rect width="512" height="512" fill="#FFFFFF"/>
    <rect y="0" width="512" height="39.38" fill="#B22234"/>
    <rect y="78.77" width="512" height="39.38" fill="#B22234"/>
    <rect y="157.54" width="512" height="39.38" fill="#B22234"/>
    <rect y="236.31" width="512" height="39.38" fill="#B22234"/>
    <rect y="315.08" width="512" height="39.38" fill="#B22234"/>
    <rect y="393.85" width="512" height="39.38" fill="#B22234"/>
    <rect y="472.62" width="512" height="39.38" fill="#B22234"/>

    <!-- Canton (Blue Field) -->
    <rect x="0" y="0" width="236" height="275.69" fill="#3C3B6E"/>

    <!-- 50 Stars in 9 Alternating Rows (6 and 5) -->
    <!-- Row 1 (6 stars) -->
    <use href="#us-star" x="24" y="28"/>
    <use href="#us-star" x="60" y="28"/>
    <use href="#us-star" x="96" y="28"/>
    <use href="#us-star" x="132" y="28"/>
    <use href="#us-star" x="168" y="28"/>
    <use href="#us-star" x="204" y="28"/>
    <!-- Row 2 (5 stars) -->
    <use href="#us-star" x="42" y="56"/>
    <use href="#us-star" x="78" y="56"/>
    <use href="#us-star" x="114" y="56"/>
    <use href="#us-star" x="150" y="56"/>
    <use href="#us-star" x="186" y="56"/>
    <!-- Row 3 (6 stars) -->
    <use href="#us-star" x="24" y="84"/>
    <use href="#us-star" x="60" y="84"/>
    <use href="#us-star" x="96" y="84"/>
    <use href="#us-star" x="132" y="84"/>
    <use href="#us-star" x="168" y="84"/>
    <use href="#us-star" x="204" y="84"/>
    <!-- Row 4 (5 stars) -->
    <use href="#us-star" x="42" y="112"/>
    <use href="#us-star" x="78" y="112"/>
    <use href="#us-star" x="114" y="112"/>
    <use href="#us-star" x="150" y="112"/>
    <use href="#us-star" x="186" y="112"/>
    <!-- Row 5 (6 stars) -->
    <use href="#us-star" x="24" y="140"/>
    <use href="#us-star" x="60" y="140"/>
    <use href="#us-star" x="96" y="140"/>
    <use href="#us-star" x="132" y="140"/>
    <use href="#us-star" x="168" y="140"/>
    <use href="#us-star" x="204" y="140"/>
    <!-- Row 6 (5 stars) -->
    <use href="#us-star" x="42" y="168"/>
    <use href="#us-star" x="78" y="168"/>
    <use href="#us-star" x="114" y="168"/>
    <use href="#us-star" x="150" y="168"/>
    <use href="#us-star" x="186" y="168"/>
    <!-- Row 7 (6 stars) -->
    <use href="#us-star" x="24" y="196"/>
    <use href="#us-star" x="60" y="196"/>
    <use href="#us-star" x="96" y="196"/>
    <use href="#us-star" x="132" y="196"/>
    <use href="#us-star" x="168" y="196"/>
    <use href="#us-star" x="204" y="196"/>
    <!-- Row 8 (5 stars) -->
    <use href="#us-star" x="42" y="224"/>
    <use href="#us-star" x="78" y="224"/>
    <use href="#us-star" x="114" y="224"/>
    <use href="#us-star" x="150" y="224"/>
    <use href="#us-star" x="186" y="224"/>
    <!-- Row 9 (6 stars) -->
    <use href="#us-star" x="24" y="252"/>
    <use href="#us-star" x="60" y="252"/>
    <use href="#us-star" x="96" y="252"/>
    <use href="#us-star" x="132" y="252"/>
    <use href="#us-star" x="168" y="252"/>
    <use href="#us-star" x="204" y="252"/>
  </g>
</svg>
